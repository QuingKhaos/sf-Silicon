;METADATA=(Diff=true, UseCommands=true)
[CommonSettings]
ManifestDependencies=Content/Localization/Game/Game.manifest
ManifestDependencies=Mods/SML/Content/Localization/SML/SML.manifest
SourcePath=Mods/GameFeatures/Silicon/Content/Localization/Silicon
DestinationPath=Mods/GameFeatures/Silicon/Content/Localization/Silicon
ManifestName=Silicon.manifest
ArchiveName=Silicon.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=pl
CulturesToGenerate=ru
CulturesToGenerate=zh
CulturesToGenerate=cs
CulturesToGenerate=es-ES
CulturesToGenerate=fr
CulturesToGenerate=hu
CulturesToGenerate=tr
CulturesToGenerate=uk

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Mods/GameFeatures/Silicon/Config
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Mods/GameFeatures/Silicon/Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/L10N/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Silicon.csv
bConflictReport=true
ConflictReportName=Silicon_Conflicts.txt

